<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bold Workspace Sim</title>
<style>
  :root { color-scheme: light dark; --bd:#8884; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px system-ui, sans-serif; display: flex; flex-direction: column; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--bd); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  label { display: inline-flex; gap: 4px; align-items: center; }
  button, select { font: inherit; padding: 4px 10px; }
  #grid { flex: 1; display: grid; gap: 6px; padding: 6px; min-height: 0; }
  #grid iframe { width: 100%; height: 100%; border: 1px solid var(--bd); background: #fff; }
  .hint { opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<header>
  <strong>Bold Workspace Sim</strong>
  <span id="users"></span>
  <label>tema <select id="theme"><option>light</option><option>dark</option></select></label>
  <button id="open">Abrir hosts lado a lado</button>
  <button id="clear">Fechar</button>
  <span class="hint">Jogo: __GAME_URL__ | iframes de mesma origem compartilham localStorage (o jogo embutido nao deve depender dele).</span>
</header>
<div id="grid"></div>
<script>
  const USERS = /*__USERS__*/[];
  const $ = (id) => document.getElementById(id);
  USERS.forEach((u, i) => {
    const l = document.createElement('label');
    const c = document.createElement('input');
    c.type = 'checkbox'; c.checked = i < 3; c.value = u.id;
    l.append(c, ` ${u.name} (${u.accountName} / ${u.workspaceName})`);
    $('users').append(l);
  });
  function open() {
    const ids = [...document.querySelectorAll('#users input:checked')].map((c) => c.value);
    const g = $('grid');
    g.innerHTML = '';
    g.style.gridTemplateColumns = `repeat(${Math.max(1, ids.length)}, minmax(0, 1fr))`;
    for (const id of ids) {
      const u = USERS.find((x) => x.id === id);
      const f = document.createElement('iframe');
      const q = new URLSearchParams({ user: u.id, name: u.name, account: u.accountId, workspace: u.workspaceId, theme: $('theme').value });
      f.src = '/host?' + q;
      f.title = u.name;
      g.append(f);
    }
  }
  $('open').onclick = open;
  $('clear').onclick = () => { $('grid').innerHTML = ''; };
  if (new URLSearchParams(location.search).has('auto')) open();
</script>
</body>
</html>
