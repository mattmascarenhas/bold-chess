<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A57C4"/>
      <stop offset="0.55" stop-color="#0047A0"/>
      <stop offset="1" stop-color="#0B1222"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#00E676" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E2F2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>

  <!-- tabuleiro sutil ao fundo -->
  <g opacity="0.07" fill="#FFFFFF">
    <rect x="0" y="880" width="128" height="144"/><rect x="256" y="880" width="128" height="144"/>
    <rect x="512" y="880" width="128" height="144"/><rect x="768" y="880" width="128" height="144"/>
  </g>

  <!-- peao -->
  <g filter="url(#shadow)" fill="url(#piece)">
    <circle cx="512" cy="338" r="118"/>
    <rect x="364" y="462" width="296" height="58" rx="29"/>
    <path d="M436 516 C436 640 384 704 340 800 L684 800 C640 704 588 640 588 516 Z"/>
    <rect x="288" y="796" width="448" height="78" rx="39"/>
  </g>

  <!-- detalhe neon -->
  <rect x="288" y="892" width="448" height="18" rx="9" fill="#00E676"/>
  <circle cx="512" cy="338" r="118" fill="none" stroke="#00E676" stroke-width="10" stroke-opacity="0.55"/>
</svg>
